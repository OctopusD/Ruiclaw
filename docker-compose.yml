x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      RUICLAW_CHANNELS: ${RUICLAW_CHANNELS:-whatsapp}
  volumes:
    - ~/.ruiclaw:/home/ruiclaw/.ruiclaw
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the ruiclaw user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  ruiclaw-gateway:
    container_name: ruiclaw-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  ruiclaw-api:
    container_name: ruiclaw-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/ruiclaw/.ruiclaw/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  ruiclaw-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
